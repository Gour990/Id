<title>Gour ID Card 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one centered 3D card on a quiet stage, drag to rotate, three presets below */
:root{
  --bg:#ecebe9; --fg:#1b1b1d; --muted:#6b6a6e; --line:#cfcdca; --accent:#d4121a; --chip:#f7f6f4; --shadow:rgba(20,10,10,.38);
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#f1f0ee;--muted:#9a999e;--line:#2c2c30;--chip:#1c1c1f;--shadow:rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--fg:#f1f0ee;--muted:#9a999e;--line:#2c2c30;--chip:#1c1c1f;--shadow:rgba(0,0,0,.75);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.spec{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.stage{position:relative;perspective:1600px;display:flex;justify-content:center;align-items:center;padding:56px 0 72px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.card{--w:min(100%,640px);width:var(--w);aspect-ratio:1012/638;position:relative;transform-style:preserve-3d;will-change:transform}
.face,.slice{position:absolute;inset:0;border-radius:3.7% / 5.9%}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:100% 100%;overflow:hidden}

  <div class="stage" id="stage" aria-label="3D preview of the ID card. Drag to rotate.">
    <div class="card" id="card">
      <div class="face front" role="img" aria-label="Card front: GOUR"></div>
      <div class="face back" role="img" aria-label="Card back: My Works"></div>
    </div>
    <div class="floor"></div>
  </div>
  <div class="controls" role="group" aria-label="View presets">
    <button type="button" data-view="front">Front</button>
    <button type="button" data-view="back">Back</button>
    <button type="button" data-view="angle">Angled</button>
    <button type="button" data-view="edge">Edge</button>
    <button type="button" id="spin" aria-pressed="false">Auto spin</button>
  </div>
  <p class="note">Drag the card to turn it. On a phone, swipe over it.</p>
</div>
<script>
(function(){
  var card=document.getElementById('card'), stage=document.getElementById('stage');
  var layers=9, i, s;
  for(i=0;i<layers;i++){
    s=document.createElement('div'); s.className='slice';
    s.style.transform='translateZ('+((i-(layers-1)/2)*0.4)+'px)';
    card.insertBefore(s, card.firstChild);
  }
  var rx=-8, ry=-18, tx=rx, ty=ry, vx=0, dragging=false, lx=0, ly=0, spin=false;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var views={front:[0,0],back:[0,180],angle:[-12,-28],edge:[-6,82]};
  function norm(a){return a}
  function render(){
    card.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
    var h=((ry%360)+360)%360; card.style.setProperty('--sheen',(50+Math.sin(ry*Math.PI/180)*60)+'%');
  }
  function tick(){
    if(!dragging){
      if(spin){ty+=0.6;}
      else if(!reduce){ }
      if(Math.abs(vx)>0.05){ty+=vx;vx*=0.94;}
      rx+=(tx-rx)*(reduce?1:0.12); ry+=(ty-ry)*(reduce?1:0.12);
    }
    render(); requestAnimationFrame(tick);
  }
  stage.addEventListener('pointerdown',function(e){dragging=true;spin=false;sync();lx=e.clientX;ly=e.clientY;vx=0;stage.classList.add('drag');try{stage.setPointerCapture(e.pointerId)}catch(_){}});
  stage.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    ty+=dx*0.45; tx-=dy*0.3; tx=Math.max(-45,Math.min(45,tx)); ry=ty; rx=tx; vx=dx*0.12;
  });
  function end(){dragging=false;stage.classList.remove('drag');tx=Math.max(-25,Math.min(25,tx))}
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  var btns=document.querySelectorAll('[data-view]'), spinBtn=document.getElementById('spin');
  function sync(){spinBtn.setAttribute('aria-pressed','false')}
  Array.prototype.forEach.call(btns,function(b){b.addEventListener('click',function(){
    var v=views[b.dataset.view]; spin=false; sync(); vx=0;
    // pick the nearest equivalent turn so the card takes the short way round
    var base=Math.round((ty-v[1])/360)*360; tx=v[0]; ty=v[1]+base;
  })});
  spinBtn.addEventListener('click',function(){spin=!spin;spinBtn.setAttribute('aria-pressed',spin?'true':'false');vx=0;tx=-8});
  requestAnimationFrame(tick);
})();
</script>

</body></html>
